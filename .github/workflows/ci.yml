name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: senoria
          POSTGRES_PASSWORD: senoria
          POSTGRES_DB: senoria_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U senoria -d senoria_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://senoria:senoria@localhost:5432/senoria_test
      TEST_DATABASE_URL: postgresql://senoria:senoria@localhost:5432/senoria_test
      JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters
      REFRESH_TOKEN_PEPPER: ci-refresh-pepper-must-be-at-least-32-chars
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
